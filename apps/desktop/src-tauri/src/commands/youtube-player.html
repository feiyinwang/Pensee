<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #player,
      #shield,
      #poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* Over YouTube's frame, so its own hover chrome (title, share, More
         videos, scrubber) never wakes: every pointer lands here. */
      #shield {
        z-index: 1;
      }
      /* YouTube's start and end screens (title, big play button, suggested
         videos), covered by the thumbnail until the video plays. */
      #poster {
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000 center / cover no-repeat;
        transition: opacity 150ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      #poster[hidden] {
        display: flex;
        opacity: 0;
        pointer-events: none;
      }
      #poster span {
        display: flex;
        width: 52px;
        height: 52px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgb(0 0 0 / 55%);
        color: #fff;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      /* Our own controls: only while the pointer moves over the video. */
      #bar {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 22px 12px 8px;
        background: linear-gradient(to top, rgb(0 0 0 / 62%), transparent);
        color: #fff;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        opacity: 0;
        pointer-events: none;
        transition: opacity 110ms ease-in;
      }
      body[data-chrome] #bar {
        opacity: 1;
        pointer-events: auto;
        transition: opacity 150ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      #toggle {
        display: flex;
        width: 24px;
        height: 24px;
        flex: none;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        cursor: default;
      }
      #time {
        flex: none;
        opacity: 0.9;
      }
      #track {
        position: relative;
        height: 14px;
        flex: 1;
        cursor: default;
      }
      #track::before,
      #fill {
        position: absolute;
        top: 6px;
        left: 0;
        height: 3px;
        border-radius: 2px;
        content: "";
      }
      #track::before {
        right: 0;
        background: rgb(255 255 255 / 28%);
      }
      #fill {
        width: 0;
        background: #fff;
      }
      svg {
        display: block;
        fill: currentColor;
      }
      @media (prefers-reduced-motion: reduce) {
        #poster,
        #bar,
        body[data-chrome] #bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <div id="shield"></div>
    <div id="poster">
      <span aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" /></svg>
      </span>
    </div>
    <div id="bar">
      <button id="toggle" type="button" aria-label="Play"></button>
      <span id="time">0:00 / 0:00</span>
      <div id="track"><div id="fill"></div></div>
    </div>
    <script>
      // Writer's YouTube player (SPECs/youtube-notes-spec.md). Served from
      // 127.0.0.1 so the embed carries an http referrer; the app frames this
      // page and talks to it with postMessage. YouTube's controls are off:
      // this page draws the little it needs and shows it only on hover.
      const query = new URLSearchParams(location.search);
      const videoId = query.get("v") || "";
      const start = Math.max(0, Math.floor(Number(query.get("t")) || 0));
      let player = null;
      let ready = false;
      let ticker = 0;
      let pending = null;
      let chromeTimer = 0;
      let scrubbing = false;

      const $ = (id) => document.getElementById(id);
      const poster = $("poster");
      const toggleButton = $("toggle");
      const PLAY =
        '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
      const PAUSE =
        '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
      poster.style.backgroundImage = `url("https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg")`;

      const post = (message) => parent.postMessage({ source: "writer-yt", ...message }, "*");

      function clock(seconds) {
        const total = Math.max(0, Math.floor(seconds || 0));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = String(total % 60).padStart(2, "0");
        return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
      }

      function playing() {
        return ready && player.getPlayerState() === YT.PlayerState.PLAYING;
      }

      function paint(at) {
        if (!ready) return;
        const duration = player.getDuration() || 0;
        const t = at ?? player.getCurrentTime();
        $("time").textContent = `${clock(t)} / ${clock(duration)}`;
        $("fill").style.width = duration ? `${Math.min(100, (t / duration) * 100)}%` : "0";
        const isPlaying = playing();
        toggleButton.innerHTML = isPlaying ? PAUSE : PLAY;
        toggleButton.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
        toggleButton.title = `${isPlaying ? "Pause" : "Play"} (⌘⇧Space)`;
      }

      function report() {
        if (!ready) return;
        const state = player.getPlayerState();
        post({
          type: "state",
          t: player.getCurrentTime(),
          playing: state === YT.PlayerState.PLAYING,
          state,
        });
        if (!scrubbing) paint();
      }

      function toggle() {
        if (!ready) return;
        if (playing()) player.pauseVideo();
        else player.playVideo();
      }

      function run(message) {
        if (message.cmd === "seek") {
          player.seekTo(Math.max(0, Number(message.t) || 0), true);
          player.playVideo();
        } else if (message.cmd === "play") {
          player.playVideo();
        } else if (message.cmd === "pause") {
          player.pauseVideo();
        } else if (message.cmd === "toggle") {
          toggle();
        }
      }

      // Hover chrome: shown on movement, gone after 2s still or on leave.
      function wake() {
        document.body.dataset.chrome = "";
        clearTimeout(chromeTimer);
        chromeTimer = setTimeout(() => {
          if (!scrubbing) delete document.body.dataset.chrome;
        }, 2000);
      }
      document.addEventListener("pointermove", wake);
      document.documentElement.addEventListener("pointerleave", () => {
        clearTimeout(chromeTimer);
        if (!scrubbing) delete document.body.dataset.chrome;
      });

      $("shield").addEventListener("click", toggle);
      poster.addEventListener("click", toggle);
      toggleButton.addEventListener("click", toggle);

      const track = $("track");
      function timeAt(event) {
        const box = track.getBoundingClientRect();
        const share = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
        return share * (player.getDuration() || 0);
      }
      track.addEventListener("pointerdown", (event) => {
        if (!ready) return;
        scrubbing = true;
        track.setPointerCapture(event.pointerId);
        paint(timeAt(event));
      });
      track.addEventListener("pointermove", (event) => {
        if (scrubbing) paint(timeAt(event));
      });
      track.addEventListener("pointerup", (event) => {
        if (!scrubbing) return;
        scrubbing = false;
        player.seekTo(timeAt(event), true);
        paint(timeAt(event));
        wake();
      });

      // After any press, the app hands focus back to the note: typing goes
      // there, not here.
      document.addEventListener("pointerup", () => post({ type: "release" }));

      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player("player", {
          videoId,
          playerVars: {
            playsinline: 1,
            rel: 0,
            start,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            origin: location.origin,
          },
          events: {
            onReady: () => {
              ready = true;
              report();
              if (pending) run(pending);
              pending = null;
            },
            onStateChange: (event) => {
              const state = event.data;
              if (state === YT.PlayerState.PLAYING) poster.hidden = true;
              else if (state === YT.PlayerState.ENDED) poster.hidden = false;
              report();
              clearInterval(ticker);
              if (state === YT.PlayerState.PLAYING) ticker = setInterval(report, 500);
            },
            onError: (event) => post({ type: "error", code: event.data }),
          },
        });
      };

      addEventListener("message", (event) => {
        if (event.source !== parent) return;
        const message = event.data;
        if (!message || message.source !== "writer") return;
        if (ready) run(message);
        else pending = message;
      });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
