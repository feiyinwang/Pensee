<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #player,
      #shield,
      #poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* Over YouTube's frame, so its own chrome (title, share, More videos,
         scrubber) never wakes: every pointer lands here. */
      #shield {
        z-index: 1;
      }
      /* YouTube's start and end screens (title, big play button, suggested
         videos), covered by the thumbnail until the video plays. */
      #poster {
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        /* hqdefault is 4:3 with the 16:9 picture between black bars: scale
           it so the picture fills the video's height, bars cropped. */
        background: #000 center / auto 133.34% no-repeat;
        transition: opacity 150ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      #poster[hidden] {
        display: flex;
        opacity: 0;
        pointer-events: none;
      }
      #poster span {
        display: flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgb(0 0 0 / 55%);
        color: #fff;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      /* Our own controls: only while the pointer moves over the video. */
      #bar {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 3;
        padding: 20px 14px 8px;
        background: linear-gradient(to top, rgb(0 0 0 / 66%), transparent);
        color: #fff;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        opacity: 0;
        pointer-events: none;
        transition: opacity 110ms ease-in;
      }
      body[data-chrome] #bar {
        opacity: 1;
        pointer-events: auto;
        transition: opacity 150ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      /* A screenshot of the video (⌘⇧S in the app): the picture alone. */
      body[data-bare] #bar,
      body[data-bare] .menu,
      body[data-bare] #badge,
      body[data-bare] #poster span {
        visibility: hidden;
        transition: none;
      }
      #row {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
      }
      #row .spacer {
        flex: 1;
      }
      button {
        display: flex;
        height: 28px;
        min-width: 28px;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 0 6px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        cursor: default;
        transition: background-color 120ms ease;
      }
      @media (hover: hover) and (pointer: fine) {
        button:hover {
          background: rgb(255 255 255 / 14%);
        }
      }
      button[aria-pressed="false"] {
        opacity: 0.6;
      }
      #time {
        flex: none;
        padding-inline: 4px;
        opacity: 0.9;
      }
      #chapter {
        min-width: 0;
        flex: 0 1 auto;
      }
      #chapter span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #chapter[hidden] {
        display: none;
      }
      /* The progress track, split where chapters start, like YouTube's. The
         hit area is the full 24px; under the pointer the line thickens, the
         chapter there thickens more, and a knob marks the playhead, so it
         reads as something to grab. */
      #track {
        position: relative;
        height: 24px;
        cursor: default;
      }
      .segment {
        position: absolute;
        top: 10px;
        height: 4px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(255 255 255 / 28%);
        transition: transform 100ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #track[data-active] .segment {
        transform: scaleY(1.5);
      }
      #track[data-active] .segment[data-hot] {
        transform: scaleY(2.25);
      }
      .segment b,
      .segment i {
        position: absolute;
        inset: 0;
        transform: scaleX(0);
        transform-origin: left;
      }
      /* Where a click would land, lighter than what has played. */
      .segment b {
        background: rgb(255 255 255 / 40%);
      }
      .segment i {
        background: #fff;
      }
      #knob {
        position: absolute;
        top: 6px;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
        transform: scale(0.5);
        transition:
          opacity 100ms cubic-bezier(0.16, 1, 0.3, 1),
          transform 100ms cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }
      #track[data-active] #knob {
        opacity: 1;
        transform: none;
      }
      #tip {
        position: absolute;
        bottom: 26px;
        max-width: 260px;
        padding: 5px 9px;
        border-radius: 6px;
        background: rgb(20 20 20 / 88%);
        font-size: 12px;
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }
      /* A long chapter name wraps to a second line before it is cut. */
      #tip strong {
        display: -webkit-box;
        overflow: hidden;
        font-weight: 500;
        text-wrap: balance;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      #tip time {
        display: block;
        opacity: 0.7;
      }
      /* The speed, for a moment, after < / >: keys get no motion. */
      #badge {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 4;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgb(0 0 0 / 62%);
        color: #fff;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      #badge[hidden] {
        display: none;
      }
      #tip[hidden] {
        display: none;
      }
      /* Chapter and speed lists, over the video above the bar. */
      .menu {
        position: absolute;
        bottom: 56px;
        z-index: 4;
        max-height: calc(100% - 72px);
        padding: 4px;
        overflow-y: auto;
        border-radius: 10px;
        background: rgb(24 24 24 / 92%);
        color: #fff;
        font-size: 13px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .menu[hidden] {
        display: none;
      }
      #chapters {
        left: 14px;
        width: min(340px, calc(100% - 28px));
      }
      #speeds {
        right: 14px;
        min-width: 96px;
      }
      .menu button {
        width: 100%;
        height: auto;
        min-height: 30px;
        justify-content: flex-start;
        gap: 10px;
        padding: 6px 10px;
        text-align: left;
      }
      .menu button[aria-current="true"] {
        background: rgb(255 255 255 / 18%);
      }
      .menu time {
        flex: none;
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      svg {
        display: block;
        fill: currentColor;
      }
      @media (prefers-reduced-motion: reduce) {
        #poster,
        #bar,
        body[data-chrome] #bar,
        .segment,
        #knob {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <div id="shield"></div>
    <div id="poster">
      <span aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" /></svg>
      </span>
    </div>
    <div id="chapters" class="menu" role="menu" hidden></div>
    <div id="speeds" class="menu" role="menu" hidden></div>
    <div id="badge" hidden></div>
    <div id="bar">
      <div id="track">
        <div id="tip" hidden></div>
        <div id="knob"></div>
      </div>
      <div id="row">
        <button id="toggle" type="button" aria-label="Play"></button>
        <span id="time">0:00 / 0:00</span>
        <button id="chapter" type="button" aria-haspopup="menu" title="Chapters" hidden>
          <span></span>
          <svg width="12" height="12" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z" /></svg>
        </button>
        <span class="spacer"></span>
        <button id="cc" type="button" aria-pressed="false" title="Subtitles">CC</button>
        <button id="speed" type="button" aria-haspopup="menu" title="Speed">1×</button>
      </div>
    </div>
    <script>
      // Pensée's YouTube player (SPECs/youtube-notes-spec.md). Served from
      // 127.0.0.1 so the embed carries an http referrer; the app frames this
      // page and talks to it with postMessage. YouTube's controls are off:
      // this page draws its own (play, time, chapters, subtitles, speed) and
      // shows them only on hover.
      const query = new URLSearchParams(location.search);
      const videoId = query.get("v") || "";
      const start = Math.max(0, Math.floor(Number(query.get("t")) || 0));
      let rate = Number(query.get("rate")) || 1;
      let captions = query.get("cc") === "1";
      let player = null;
      let ready = false;
      let ticker = 0;
      let pending = [];
      let chromeTimer = 0;
      let scrubbing = false;
      let chapters = [];
      let segments = [];

      const $ = (id) => document.getElementById(id);
      const poster = $("poster");
      const toggleButton = $("toggle");
      const chapterButton = $("chapter");
      const ccButton = $("cc");
      const speedButton = $("speed");
      const track = $("track");
      const tip = $("tip");
      const knob = $("knob");
      const PLAY =
        '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
      const PAUSE =
        '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
      poster.style.backgroundImage = `url("https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg")`;

      const post = (message) => parent.postMessage({ source: "pensee-yt", ...message }, "*");

      function clock(seconds) {
        const total = Math.max(0, Math.floor(seconds || 0));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = String(total % 60).padStart(2, "0");
        return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
      }

      const duration = () => (ready && player.getDuration()) || 0;
      const playing = () => ready && player.getPlayerState() === YT.PlayerState.PLAYING;

      /** The chapter playing at `t`, or -1. */
      function chapterAt(t) {
        let found = -1;
        for (let i = 0; i < chapters.length && chapters[i].start <= t; i++) found = i;
        return found;
      }

      // One segment per chapter (one for the whole video without), with a
      // 2px gap at each chapter start.
      function layoutTrack() {
        for (const segment of segments) segment.remove();
        const total = duration();
        const starts = chapters.length && total ? chapters.map((c) => c.start) : [0];
        segments = starts.map((from, i) => {
          const to = i + 1 < starts.length ? starts[i + 1] : total;
          const segment = document.createElement("div");
          segment.className = "segment";
          segment.dataset.from = String(from);
          segment.dataset.to = String(to);
          const share = (x) => (total ? (x / total) * 100 : 0);
          segment.style.left = `${share(from)}%`;
          segment.style.width = total
            ? `calc(${share(to - from)}% - ${i + 1 < starts.length ? 2 : 0}px)`
            : "100%";
          // <b> fills to the hovered time, <i> (over it) to the playhead.
          segment.append(document.createElement("b"), document.createElement("i"));
          track.insertBefore(segment, tip);
          return segment;
        });
      }

      function paint(at) {
        if (!ready) return;
        const total = duration();
        const t = at ?? player.getCurrentTime();
        $("time").textContent = `${clock(t)} / ${clock(total)}`;
        if (segments.length === 0 || (total && segments.at(-1).dataset.to === "0")) layoutTrack();
        for (const segment of segments) {
          const from = Number(segment.dataset.from);
          const to = Number(segment.dataset.to) || total;
          const fill = to > from ? Math.min(1, Math.max(0, (t - from) / (to - from))) : 0;
          segment.lastChild.style.transform = `scaleX(${fill})`;
        }
        knob.style.left = `${total ? Math.min(1, t / total) * 100 : 0}%`;
        const index = chapterAt(t);
        chapterButton.hidden = index < 0;
        if (index >= 0) chapterButton.firstElementChild.textContent = chapters[index].title;
        const isPlaying = playing();
        toggleButton.innerHTML = isPlaying ? PAUSE : PLAY;
        toggleButton.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
        toggleButton.title = `${isPlaying ? "Pause" : "Play"} (⌘⇧J)`;
      }

      function report() {
        if (!ready) return;
        const state = player.getPlayerState();
        post({
          type: "state",
          t: player.getCurrentTime(),
          playing: state === YT.PlayerState.PLAYING,
          state,
        });
        if (!scrubbing) paint();
      }

      function toggle() {
        if (!ready) return;
        if (playing()) player.pauseVideo();
        else player.playVideo();
      }

      function seek(t) {
        player.seekTo(Math.max(0, t), true);
        paint(t);
      }

      /** ← / →: `by` seconds back or on, playing or paused as it was; the
       *  bar shows where it landed. */
      function skip(by) {
        if (!ready) return;
        const total = duration();
        const t = Math.min(Math.max(0, player.getCurrentTime() + by), total || Infinity);
        const state = player.getPlayerState();
        // Not started (the poster covers it): a seek would be dropped, so
        // it plays from there, as a pin does.
        if (state === YT.PlayerState.UNSTARTED || state === YT.PlayerState.CUED) {
          run({ cmd: "seek", t });
          post({ type: "state", t, playing: false, state });
          return;
        }
        seek(t);
        // Not report(): YouTube's own time lags the seek for a moment, and
        // a paused video sends no later report to correct it.
        post({ type: "state", t, playing: playing(), state: player.getPlayerState() });
        wake();
      }

      // Subtitles: YouTube's captions module, on or off. The choice is the
      // app's to keep (this page's origin changes every launch).
      function applyCaptions() {
        ccButton.setAttribute("aria-pressed", String(captions));
        if (!ready) return;
        if (captions) player.loadModule("captions");
        else player.unloadModule("captions");
      }

      function applyRate() {
        speedButton.textContent = `${rate}×`;
        if (ready) player.setPlaybackRate(rate);
      }

      const savePrefs = () => post({ type: "prefs", rate, cc: captions });

      let badgeTimer = 0;
      /** One step along YouTube's speed list, shown for a moment. */
      function stepSpeed(step) {
        const rates = (ready && player.getAvailablePlaybackRates()) || [
          0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2,
        ];
        const at = rates.indexOf(rate);
        const next =
          rates[Math.min(rates.length - 1, Math.max(0, (at < 0 ? rates.indexOf(1) : at) + step))];
        if (next !== undefined && next !== rate) {
          rate = next;
          applyRate();
          savePrefs();
        }
        const badge = document.getElementById("badge");
        badge.textContent = rate === 1 ? "Normal" : `${rate}×`;
        badge.hidden = false;
        clearTimeout(badgeTimer);
        badgeTimer = setTimeout(() => (badge.hidden = true), 700);
      }

      function run(message) {
        if (message.cmd === "seek") {
          const t = Math.max(0, Number(message.t) || 0);
          const state = player.getPlayerState();
          // Not started yet (the note just opened): seekTo + playVideo
          // buffers, then falls back to unstarted. Loading at `t` plays.
          if (state === YT.PlayerState.UNSTARTED || state === YT.PlayerState.CUED) {
            player.loadVideoById({ videoId, startSeconds: t });
          } else {
            player.seekTo(t, true);
            player.playVideo();
          }
        } else if (message.cmd === "play") {
          player.playVideo();
        } else if (message.cmd === "pause") {
          player.pauseVideo();
        } else if (message.cmd === "speed") {
          stepSpeed(message.step < 0 ? -1 : 1);
        } else if (message.cmd === "toggle") {
          toggle();
        } else if (message.cmd === "skip") {
          skip(Number(message.by) || 0);
        }
      }

      // Hover chrome: shown on movement, gone after 2s still or on leave,
      // kept while the pointer rests on the bar (reading a chapter's name),
      // a list is open or the track is held.
      let overBar = false;
      const menuOpen = () => !$("chapters").hidden || !$("speeds").hidden;
      function sleep() {
        if (!scrubbing && !overBar && !menuOpen()) delete document.body.dataset.chrome;
      }
      $("bar").addEventListener("pointerenter", () => (overBar = true));
      $("bar").addEventListener("pointerleave", () => {
        overBar = false;
        wake();
      });
      function wake() {
        document.body.dataset.chrome = "";
        clearTimeout(chromeTimer);
        chromeTimer = setTimeout(sleep, 2000);
      }
      // The app is told while the pointer is over the video: its ← / →
      // then skip this video instead of moving the caret, and ⇧, / ⇧.
      // change its speed instead of typing.
      let hovering = false;
      document.addEventListener("pointermove", () => {
        if (!hovering) {
          hovering = true;
          post({ type: "hover", over: true });
        }
        wake();
      });
      document.documentElement.addEventListener("pointerleave", () => {
        hovering = false;
        post({ type: "hover", over: false });
        overBar = false;
        clearTimeout(chromeTimer);
        closeMenus();
        sleep();
      });

      function closeMenus() {
        $("chapters").hidden = true;
        $("speeds").hidden = true;
      }

      function openMenu(menu, items) {
        const wasOpen = !menu.hidden;
        closeMenus();
        if (wasOpen) return;
        menu.replaceChildren(...items);
        menu.hidden = false;
        menu.querySelector('[aria-current="true"]')?.scrollIntoView({ block: "center" });
      }

      function menuItem(label, current, onPick, time) {
        const item = document.createElement("button");
        item.type = "button";
        item.setAttribute("role", "menuitem");
        item.setAttribute("aria-current", String(current));
        if (time !== undefined) {
          const stamp = document.createElement("time");
          stamp.textContent = clock(time);
          item.append(stamp);
        }
        item.append(label);
        item.addEventListener("click", () => {
          closeMenus();
          onPick();
          wake();
        });
        return item;
      }

      chapterButton.addEventListener("click", () => {
        const current = chapterAt(ready ? player.getCurrentTime() : 0);
        openMenu(
          $("chapters"),
          chapters.map((c, i) => menuItem(c.title, i === current, () => seek(c.start), c.start)),
        );
      });

      speedButton.addEventListener("click", () => {
        const rates = (ready && player.getAvailablePlaybackRates()) || [0.5, 1, 1.25, 1.5, 2];
        openMenu(
          $("speeds"),
          rates.map((r) =>
            menuItem(r === 1 ? "Normal" : `${r}×`, r === rate, () => {
              rate = r;
              applyRate();
              savePrefs();
            }),
          ),
        );
      });

      ccButton.addEventListener("click", () => {
        captions = !captions;
        applyCaptions();
        savePrefs();
      });

      $("shield").addEventListener("click", () => {
        if (menuOpen()) closeMenus();
        else toggle();
      });
      poster.addEventListener("click", toggle);
      toggleButton.addEventListener("click", toggle);

      // The track: click or drag to a time; hover names the chapter there
      // and fills the line up to it.
      function timeAt(event) {
        const box = track.getBoundingClientRect();
        const share = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
        return { t: share * duration(), x: share * box.width };
      }
      /** Fill to `t` and thicken the chapter under it; null clears both. */
      function hoverAt(t) {
        const total = duration();
        for (const [i, segment] of segments.entries()) {
          const from = Number(segment.dataset.from);
          const to = Number(segment.dataset.to) || total;
          const fill =
            t === null || to <= from ? 0 : Math.min(1, Math.max(0, (t - from) / (to - from)));
          segment.firstChild.style.transform = `scaleX(${fill})`;
          const last = i === segments.length - 1;
          segment.toggleAttribute(
            "data-hot",
            segments.length > 1 && t !== null && t >= from && (t < to || last),
          );
        }
      }
      function showTip(event) {
        const { t, x } = timeAt(event);
        const index = chapterAt(t);
        const stamp = document.createElement("time");
        stamp.textContent = clock(t);
        if (index >= 0) {
          const title = document.createElement("strong");
          title.textContent = chapters[index].title;
          tip.replaceChildren(title, stamp);
        } else tip.replaceChildren(stamp);
        tip.hidden = false;
        // Kept whole inside the track, however long the chapter's name.
        const half = tip.offsetWidth / 2;
        tip.style.left = `${Math.min(Math.max(x, half), track.clientWidth - half)}px`;
        hoverAt(t);
      }
      function leaveTrack() {
        delete track.dataset.active;
        tip.hidden = true;
        hoverAt(null);
      }
      track.addEventListener("pointerenter", () => {
        if (ready) track.dataset.active = "";
      });
      track.addEventListener("pointerdown", (event) => {
        if (!ready) return;
        scrubbing = true;
        track.dataset.active = "";
        track.setPointerCapture(event.pointerId);
        paint(timeAt(event).t);
      });
      track.addEventListener("pointermove", (event) => {
        if (!ready) return;
        track.dataset.active = "";
        showTip(event);
        if (scrubbing) paint(timeAt(event).t);
      });
      track.addEventListener("pointerleave", () => {
        if (!scrubbing) leaveTrack();
      });
      track.addEventListener("pointerup", (event) => {
        if (!scrubbing) return;
        scrubbing = false;
        seek(timeAt(event).t);
        // Released off the track: the drag carried it out, so let go of it.
        if (!track.contains(document.elementFromPoint(event.clientX, event.clientY))) leaveTrack();
        wake();
      });

      // Focus is the note's (below), but should it be here, ← / → skip too,
      // still only with the pointer on the video.
      document.addEventListener("keydown", (event) => {
        // ⌘S (pin) and ⌘⇧S (screenshot) are the app's, wherever focus is.
        if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase() === "s") {
          event.preventDefault();
          if (!event.repeat) post({ type: "key", shift: event.shiftKey });
          return;
        }
        if (!hovering || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
        const by = { ArrowLeft: -5, ArrowRight: 5 }[event.key];
        if (by === undefined) return;
        event.preventDefault();
        skip(by);
      });

      // After any press, the app hands focus back to the note: typing goes
      // there, not here.
      document.addEventListener("pointerup", () => post({ type: "release" }));
      // Scrolling or pinching over the video belongs to the note around it.
      document.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          post({
            type: "wheel",
            deltaX: event.deltaX,
            deltaY: event.deltaY,
            ctrlKey: event.ctrlKey,
          });
        },
        { passive: false },
      );

      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player("player", {
          videoId,
          playerVars: {
            playsinline: 1,
            rel: 0,
            start,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            origin: location.origin,
            // Any value here, 0 too, turns the default track on.
            ...(captions ? { cc_load_policy: 1 } : {}),
          },
          events: {
            onReady: () => {
              ready = true;
              applyRate();
              report();
              for (const message of pending) run(message);
              pending = [];
            },
            onStateChange: (event) => {
              const state = event.data;
              if (state === YT.PlayerState.PLAYING) {
                poster.hidden = true;
                if (!captions) player.unloadModule("captions");
                // A (re)load starts at normal speed.
                if (player.getPlaybackRate() !== rate) player.setPlaybackRate(rate);
              } else if (state === YT.PlayerState.ENDED) poster.hidden = false;
              report();
              clearInterval(ticker);
              if (state === YT.PlayerState.PLAYING) ticker = setInterval(report, 500);
            },
            // The captions module loads once playback starts, with the
            // video's default track; keep it off unless asked for.
            onApiChange: () => {
              if (!captions) player.unloadModule("captions");
            },
            onPlaybackRateChange: (event) => {
              rate = event.data;
              speedButton.textContent = `${rate}×`;
            },
            onError: (event) => post({ type: "error", code: event.data }),
          },
        });
      };

      addEventListener("message", (event) => {
        if (event.source !== parent) return;
        const message = event.data;
        if (!message || message.source !== "pensee") return;
        // Before the player is ready too: a screenshot of the poster.
        if (message.cmd === "bare") {
          if (message.on) document.body.dataset.bare = "";
          else delete document.body.dataset.bare;
          // Two frames: off the screen, not just out of the style.
          requestAnimationFrame(() =>
            requestAnimationFrame(() => post({ type: "bare", on: Boolean(message.on) })),
          );
          return;
        }
        if (message.cmd === "chapters") {
          chapters = Array.isArray(message.chapters) ? message.chapters : [];
          segments.forEach((s) => s.remove());
          segments = [];
          paint();
          return;
        }
        if (ready) run(message);
        else pending = [message];
      });

      applyRate();
      applyCaptions();
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
