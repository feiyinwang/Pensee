<!doctype html>
<!-- THROWAWAY PROTOTYPE (emil-prototype). Nothing imports this. Delete after the decision. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proto · Quiz me</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      :root {
        /* Settings the app writes at runtime; light-theme values for the proto. */
        --contrast: 0.2;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-exit: cubic-bezier(0.4, 0, 1, 1);
        --motion-fast: 100ms;
        --motion-hover: 150ms;
        --motion-settle: 180ms;
        --motion-word: 220ms;
        --col: 680px;
        /* Same AI ink as proto/ai-writing, so both explorations read as one voice. */
        --ai-ink: var(--hue-blue);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--color-bg-app);
        color: var(--color-text-primary);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        font-synthesis: none;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      kbd {
        font: inherit;
        font-size: var(--font-size-caption);
        min-width: 18px;
        text-align: center;
        padding: 0 5px;
        border-radius: var(--radius-chip);
        background: var(--color-bg-kbd);
        color: var(--color-text-muted);
      }
      :focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }
      [contenteditable]:focus-visible {
        outline: none;
      }

      /* ---------------- The window and its panes ---------------- */
      .win {
        position: fixed;
        inset: 12px;
        display: flex;
        overflow: hidden;
        background: var(--color-bg-canvas);
        border-radius: var(--radius-window);
        box-shadow: var(--shadow-card);
      }
      .scroller {
        flex: 1 1 0;
        min-width: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-padding-bottom: 120px;
      }
      .col {
        width: var(--col);
        max-width: calc(100% - 64px);
        margin-inline: auto;
      }
      .page-head {
        padding-top: 64px;
      }
      .title {
        font-family: var(--font-title);
        font-weight: 500;
        font-size: 34px;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
        text-wrap: balance;
      }
      .props {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 6px 12px;
        margin: 0 0 24px;
        font-size: var(--font-size-label);
        line-height: 20px;
      }
      .props dt {
        color: var(--color-text-muted);
        font-weight: 500;
      }
      .props dd {
        margin: 0;
        color: var(--color-text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Toolbar buttons (Pin / Quiz me): video-pin-button's look. */
      .band-row {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
        padding-top: 6px;
      }
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding-inline: 7px;
        border-radius: var(--radius-chip);
        color: var(--color-text-muted);
        font-size: var(--font-size-label);
        font-weight: 500;
        white-space: nowrap;
        transition:
          color var(--motion-hover) var(--ease-out),
          background-color var(--motion-hover) var(--ease-out),
          transform var(--motion-hover) var(--ease-out);
      }
      .tbtn kbd {
        background: none;
        padding: 0;
        min-width: 0;
      }
      .tbtn:active {
        transform: scale(0.97);
      }
      .tbtn[data-on] {
        color: var(--color-text-primary);
        background: var(--color-bg-subtle);
      }
      @media (hover: hover) and (pointer: fine) {
        .tbtn:hover {
          color: var(--color-text-primary);
          background: var(--color-bg-subtle);
        }
      }

      /* ---------------- The video band (video-player.css) ---------------- */
      .video-band {
        position: sticky;
        top: 0;
        z-index: 6;
        padding: 0 12px 4px;
        border-bottom: 1px solid transparent;
      }
      .video-band[data-stuck] {
        border-bottom-color: var(--color-border-subtle);
        background: color-mix(in oklch, var(--color-bg-canvas) 78%, transparent);
        -webkit-backdrop-filter: blur(20px) saturate(1.3);
        backdrop-filter: blur(20px) saturate(1.3);
      }
      .video-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 60vh;
        overflow: hidden;
        border-radius: var(--radius-menu);
        background: var(--color-letterbox);
        box-shadow:
          0 0 0 1px var(--line-subtle),
          var(--shadow-overlay);
        cursor: pointer;
      }
      /* The picture itself is video content, not UI: its colours are the video's. */
      .poster {
        position: absolute;
        inset: 0;
        margin: auto;
        height: 100%;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        background: radial-gradient(
          120% 90% at 20% 10%,
          oklch(0.34 0.04 250),
          oklch(0.17 0.02 250)
        );
        color: oklch(0.96 0.01 90);
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 4%;
        padding: 0 8%;
      }
      .poster h3 {
        margin: 0;
        font-family: var(--font-title);
        font-weight: 500;
        font-size: clamp(22px, 3.4vw, 46px);
        line-height: 1.05;
      }
      .poster p {
        margin: 10px 0 0;
        font-size: clamp(11px, 1vw, 14px);
        opacity: 0.7;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .poster svg {
        width: 100%;
        height: auto;
      }
      .vbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 28px 14px 10px;
        background: linear-gradient(transparent, rgb(0 0 0 / 55%));
        color: var(--white);
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        opacity: 0;
        transition: opacity var(--motion-settle) var(--ease-out);
      }
      .video-frame:hover .vbar,
      .video-frame:focus-within .vbar,
      .video-frame[data-paused-flash] .vbar {
        opacity: 1;
      }
      .vplay {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-chip);
        flex-shrink: 0;
      }
      .vplay svg {
        width: 16px;
        height: 16px;
      }
      .vtime {
        white-space: nowrap;
        flex-shrink: 0;
      }
      .vtrack {
        flex: 1;
        display: flex;
        gap: 3px;
        height: 16px;
        align-items: center;
        cursor: pointer;
      }
      .vseg {
        position: relative;
        height: 3px;
        border-radius: 2px;
        background: rgb(255 255 255 / 30%);
        overflow: hidden;
      }
      .vseg i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--white);
      }
      .vchap {
        white-space: nowrap;
        flex-shrink: 0;
        max-width: 32%;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0.9;
      }
      .vflash {
        position: absolute;
        top: 14px;
        left: 50%;
        translate: -50% 0;
        padding: 4px 10px;
        border-radius: var(--radius-pill);
        background: rgb(0 0 0 / 60%);
        color: var(--white);
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--motion-settle) var(--ease-out);
      }
      .vflash[data-on] {
        opacity: 1;
      }

      /* Podcast: a compact audio bar on the text column, sticky like the video. */
      .video-band.is-audio {
        padding-top: 4px;
      }
      .audio {
        position: relative;
        display: grid;
        grid-template-columns: 48px 32px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        width: var(--col);
        max-width: calc(100% - 40px);
        margin: 0 auto;
        padding: 10px 12px 10px 10px;
        border-radius: var(--radius-menu);
        background: var(--color-bg-canvas);
        box-shadow:
          0 0 0 1px var(--line-subtle),
          var(--shadow-overlay);
      }
      /* The cover art is the show's, not UI. */
      .audio .cover {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-8);
        display: grid;
        place-items: center;
        background: radial-gradient(
          120% 100% at 30% 20%,
          oklch(0.42 0.08 280),
          oklch(0.2 0.05 280)
        );
        color: oklch(0.96 0.01 90);
        font-family: var(--font-title);
        font-size: 20px;
        letter-spacing: 0.02em;
      }
      .audio .vplay {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--color-bg-inverse);
        color: var(--color-text-inverse);
        transition: transform var(--motion-hover) var(--ease-out);
      }
      .audio .vplay:active {
        transform: scale(0.97);
      }
      .audio .vplay svg {
        width: 13px;
        height: 13px;
      }
      .ameta {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .atitle {
        font-size: var(--font-size-label);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ainfo {
        display: flex;
        gap: 6px;
        min-width: 0;
        font-size: var(--font-size-caption);
        color: var(--color-text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ainfo .vchap {
        max-width: none;
        flex-shrink: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 1;
      }
      .audio .vtrack {
        flex: none;
        height: 10px;
      }
      .audio .vseg {
        background: var(--color-bg-subtle-strong);
      }
      .audio .vseg i {
        background: var(--color-text-primary);
      }
      .aspeed {
        min-width: 44px;
        height: 28px;
        padding: 0 8px;
        border-radius: var(--radius-button);
        color: var(--color-text-secondary);
        font-size: var(--font-size-label);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        transition: background-color var(--motion-hover) var(--ease-out);
      }
      @media (hover: hover) and (pointer: fine) {
        .aspeed:hover {
          background: var(--color-bg-hover);
        }
      }
      .audio .vflash {
        display: none;
      }
      .is-audio .band-row {
        width: var(--col);
        max-width: calc(100% - 40px);
      }

      /* Mini player (the board's): On the page parks the video top-right while quizzing. */
      .win[data-mini] .video-band {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 320px;
        padding: 0;
        z-index: 8;
        background: none;
        border: 0;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .win[data-mini] .video-band .band-row {
        display: none;
      }
      .win[data-mini] .poster h3 {
        font-size: 15px;
      }
      .win[data-mini] .poster p,
      .win[data-mini] .vchap {
        display: none;
      }

      /* ---------------- Notes (the editor) ---------------- */
      .doc {
        padding: 18px 0 220px;
        font-family: var(--font-editor);
        font-size: var(--font-size-editor);
        line-height: 1.6;
        outline: none;
        caret-color: var(--color-accent);
      }
      .doc ::selection {
        background: var(--color-selection);
      }
      .doc ul {
        margin: 0;
        padding-left: 1.45em;
        list-style-type: disc;
      }
      .doc li {
        margin: 0.3em 0;
        padding-left: 0.15em;
      }
      .doc li::marker {
        color: var(--color-text-faint);
      }
      .doc li.hl {
        color: var(--color-text-secondary);
      }
      .transcript {
        margin: 0 0 12px;
        color: var(--color-text-secondary);
      }
      .transcript summary {
        cursor: pointer;
        font-family: var(--font-ui);
        font-size: var(--font-size-label);
        font-weight: 500;
        color: var(--color-text-muted);
        width: max-content;
      }
      .transcript p {
        font-size: 0.9em;
        margin: 0.5em 0;
      }
      .transcript small {
        color: var(--color-text-muted);
        font-family: var(--font-ui);
        font-variant-numeric: tabular-nums;
        margin-right: 6px;
      }
      .pin,
      .bkref {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        margin-left: 6px;
        color: var(--color-text-faint);
        font-family: var(--font-ui);
        font-size: var(--font-size-caption);
        font-variant-numeric: tabular-nums;
        user-select: none;
        cursor: pointer;
        vertical-align: baseline;
        border-radius: var(--radius-chip);
        transition: color var(--motion-hover) var(--ease-out);
      }
      .pin svg {
        width: 11px;
        height: 11px;
        translate: 0 1px;
      }
      @media (hover: hover) and (pointer: fine) {
        .pin:hover,
        .bkref:hover {
          color: var(--color-text-primary);
        }
      }
      .flash {
        animation: flash 1.2s var(--ease-out);
        border-radius: var(--radius-chip);
      }
      /* book-reader.css ::highlight(book-flash) */
      @keyframes flash {
        0%,
        30% {
          background: color-mix(in srgb, var(--fg-base) 30%, transparent);
        }
        100% {
          background: transparent;
        }
      }

      /* ---------------- Book reader ---------------- */
      .reader {
        background: var(--color-bg-raised);
        border-right: 1px solid var(--color-border-subtle);
      }
      .reader-col {
        max-width: 62ch;
        margin: 0 auto;
        padding: 64px 48px 160px;
        font-family: var(--font-book-serif);
        font-size: 19px;
        line-height: 1.6;
        color: var(--color-text-primary);
      }
      .reader-col .r-chap {
        font-family: var(--font-ui);
        font-size: var(--font-size-caption);
        font-weight: 500;
        color: var(--color-text-muted);
        margin: 0 0 6px;
      }
      .reader-col h2 {
        font-family: var(--font-title);
        font-weight: 500;
        font-size: 28px;
        line-height: 1.15;
        margin: 0 0 28px;
        text-wrap: balance;
      }
      .reader-col p {
        margin: 0 0 1em;
        text-wrap: pretty;
        hanging-punctuation: first;
      }
      /* book-reader.css ::highlight(book-highlight) */
      .reader-col mark {
        background: color-mix(in srgb, var(--fg-base) 14%, transparent);
        color: inherit;
        border-radius: 2px;
      }
      .r-here {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 28px 0;
        font-family: var(--font-ui);
        font-size: var(--font-size-caption);
        color: var(--color-text-faint);
      }
      .r-here::before,
      .r-here::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--color-border-subtle);
      }
      .unread {
        color: var(--color-text-muted);
      }

      /* ---------------- AI text, written word by word ---------------- */
      .w {
        display: inline-block;
        animation: word-in var(--motion-word) var(--ease-out) both;
      }
      @keyframes word-in {
        from {
          opacity: 0;
          filter: blur(3px);
          transform: translateY(2px);
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }
      .leaving {
        opacity: 0;
        transition: opacity 140ms var(--ease-exit);
      }

      /* ---------------- 1 · Second pen (proto/ai-writing, same rules) ---------------- */
      .doc li {
        position: relative;
      }
      /* ⌘. arms the AI: the selection (or the caret's line) turns AI-blue until the next key. */
      .doc.armed ::selection {
        background: color-mix(in oklch, var(--ai-ink) 24%, transparent);
      }
      ::highlight(proto-armed) {
        background-color: color-mix(in oklch, var(--ai-ink) 16%, transparent);
      }
      .doc li.ai:focus-visible {
        outline: 2px solid var(--color-text-faint);
        outline-offset: 2px;
        border-radius: 3px;
      }
      .doc li.ai {
        color: var(--ai-ink);
        cursor: pointer;
      }
      .doc li.ai::marker {
        content: "◦  ";
        color: var(--ai-ink);
      }
      .doc li.ai .src {
        color: color-mix(in oklch, var(--ai-ink) 55%, var(--color-text-faint));
        font-size: 0.85em;
        white-space: nowrap;
        animation: fade-in var(--motion-settle) var(--ease-out) both;
      }
      .doc li.ai .src svg {
        width: 11px;
        height: 11px;
        translate: 0 1px;
      }
      @media (hover: hover) and (pointer: fine) {
        .doc li.ai:hover > .t {
          text-decoration: underline;
          text-decoration-color: color-mix(in oklch, var(--ai-ink) 35%, transparent);
          text-underline-offset: 4px;
        }
        .doc li.ai .src:hover {
          color: var(--ai-ink);
        }
      }
      /* Your answers under an AI line are yours: your ink, your caret. */
      .doc li.ai > ul {
        color: var(--color-text-primary);
        cursor: text;
      }
      .dk {
        color: var(--color-text-muted);
        font-style: italic;
        user-select: none;
      }
      /* The keys for what you can do next, under the line you're on (ai-writing's hint, moved under the note). */
      .doc li.pen-keys {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        align-items: center;
        margin: 0.15em 0 0.35em;
        font-family: var(--font-ui);
        font-size: var(--font-size-caption);
        line-height: 20px;
        color: var(--color-text-muted);
        user-select: none;
        cursor: default;
        animation: fade-in var(--motion-settle) var(--ease-out) both;
      }
      .doc li.pen-keys::marker {
        content: none;
      }
      .pen-keys b {
        font-weight: 600;
        color: var(--color-text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .pen-keys .gap {
        width: 8px;
      }
      /* ? at a note's right edge: quiz me on this note. The AI's marker, as a button. */
      .qz {
        position: absolute;
        z-index: 4;
        translate: 0 -50%;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        color: var(--ai-ink);
        background: var(--color-bg-canvas);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        opacity: 0.55;
        transition:
          opacity var(--motion-hover) var(--ease-out),
          transform var(--motion-hover) var(--ease-out);
      }
      .qz[hidden] {
        display: none;
      }
      .qz:active {
        transform: scale(0.97);
      }
      @media (hover: hover) and (pointer: fine) {
        .qz:hover {
          opacity: 1;
        }
      }
      /* Shorten: red pencil, deletion only (proto/ai-writing). */
      .cut {
        cursor: pointer;
        color: var(--color-text-faint);
        text-decoration: line-through;
        text-decoration-color: var(--hue-red);
        text-decoration-thickness: 1.5px;
        border-radius: 3px;
        transition:
          opacity 140ms var(--ease-exit),
          color var(--motion-fast) var(--ease-out),
          background-color var(--motion-fast) var(--ease-out);
        animation: fade-in var(--motion-settle) var(--ease-out) both;
      }
      .cut[data-kept] {
        color: inherit;
        text-decoration-color: transparent;
        background: var(--color-bg-subtle);
      }
      .cut.going {
        opacity: 0;
      }
      @media (hover: hover) and (pointer: fine) {
        .cut:hover {
          background: var(--color-bg-hover);
        }
      }
      .hint {
        position: fixed;
        left: 50%;
        translate: -50% 0;
        bottom: 76px;
        z-index: 20;
        padding: 6px 12px;
        border-radius: var(--radius-pill);
        background: var(--color-bg-popover);
        box-shadow: var(--shadow-popover);
        border: 1px solid var(--color-border-floating);
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: var(--font-size-caption);
        color: var(--color-text-secondary);
        user-select: none;
        pointer-events: none;
        white-space: nowrap;
        opacity: 0;
        transition: opacity var(--motion-settle) var(--ease-out);
      }
      .hint[data-live] {
        opacity: 1;
      }
      .hint .gap {
        width: 8px;
      }

      /* ---------------- 2 · Closed book ---------------- */
      .cb {
        position: absolute;
        inset: 0;
        z-index: 30;
      }
      .cb-veil {
        position: absolute;
        inset: 0;
        background: color-mix(in oklch, var(--color-bg-canvas) 70%, transparent);
        -webkit-backdrop-filter: blur(16px) saturate(0.9);
        backdrop-filter: blur(16px) saturate(0.9);
        animation: fade-in var(--motion-settle) var(--ease-out) both;
      }
      .cb-card {
        position: absolute;
        top: 14vh;
        left: 50%;
        width: 600px;
        max-width: calc(100% - 48px);
        translate: -50% 0;
        padding: 20px 24px 22px;
        background: var(--color-bg-popover);
        border: 1px solid var(--color-border-floating);
        border-radius: var(--radius-sheet);
        box-shadow: var(--shadow-dialog);

         - Then follow-ups on the same idea (why, how, your own example).
           With notes, one follow-up quotes your note back at you.
         - New topic skips to the next idea. Stop ends it, any time.

              at: 65,
              src: "Rereading makes the page familiar, and familiarity feels like knowing. But recognising something when it’s in front of you is a different skill from pulling it out of memory when it isn’t.",

              hint: "It makes the page feel a certain way. Which word did the video use for that feeling?",

                "You wrote “familiarity, not recall.” Which of your notes on this video could you only recognise, not recall?",
              deeper: [

              at: 250,
              src: "In the 1880s Hermann Ebbinghaus memorised lists of nonsense syllables and tested himself at intervals. Most of what he lost, he lost within the first day. After that, the curve flattens.",
              recall: "What did Ebbinghaus find about when we forget the most?",

            const f = $(".vflash", frame);
            f.textContent = text;
            f.toggleAttribute("data-on", true);
            frame.toggleAttribute("data-paused-flash", true);
            clearTimeout(flashT);
            flashT = setTimeout(() => {
              f.removeAttribute("data-on");
              frame.removeAttribute("data-paused-flash");
            }, 1100);
          };
          let speed = 1;
          const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
          const setPlaying = (on) => {
            playing = on;
            clearInterval(tick);
            if (on)
              tick = setInterval(() => {
                t = Math.min(C.dur, t + speed);
                render();
              }, 1000);
            render();
          };
          P.timers.push(
            () => clearInterval(tick),
            () => clearTimeout(flashT),
          );
          // The video plays from anywhere on it; the podcast bar only from its button.
          P.toggle = () => {
            setPlaying(!playing);
            flash(playing ? "Playing" : "Paused");
          };
          frame.addEventListener("click", (e) => {
            if (e.target.closest(".vtrack, .aspeed")) return;
            if (C.kind === "podcast" && !e.target.closest(".vplay")) return;
            P.toggle();
          });
          $(".aspeed", frame)?.addEventListener("click", (e) => {
            speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
            e.currentTarget.textContent = `${speed}×`;
          });
          $(".vtrack", frame).addEventListener("click", (e) => {
            const r = e.currentTarget.getBoundingClientRect();
            P.seek(((e.clientX - r.left) / r.width) * C.dur);
          });
          P.now = () => t;
          P.pause = (say) => {
            if (playing) {
              setPlaying(false);
              if (say) flash("Paused");
            }
          };
          P.seek = (s) => {
            t = Math.max(0, Math.min(C.dur, Math.round(s)));
            render();
            flash(fmt(t));
          };
          P.jump = (seg) => P.seek(seg.at);
          P.seen = (s) => s.at <= t;
          P.ref = (seg) =>
            `<span class="pin" contenteditable="false" data-seg="${seg.id}" title="${fmt(seg.at)}">${PIN}</span>`;
          P.scroller = pane;
          const pad = () => {
            pane.style.scrollPaddingTop =
              (win.hasAttribute("data-mini") ? 16 : band.offsetHeight + 16) + "px";
          };
          const stuck = () =>
            band.toggleAttribute(
              "data-stuck",
              pane.scrollTop > band.offsetTop - 1 && !win.hasAttribute("data-mini"),
            );
          pane.addEventListener("scroll", stuck, { passive: true });
          addEventListener("resize", pad);
          P.timers.push(() => removeEventListener("resize", pad));
          P.layout = () => {
            pad();
            stuck();
          };
          render();
          requestAnimationFrame(P.layout);
        } else {
          const mark = (s) => {
            let x = esc(s.text);
            if (withNotes) for (const m of s.marks) x = x.replace(esc(m), `<mark>${esc(m)}</mark>`);
            return x;
          };
          win.innerHTML = `
            <div class="scroller reader" id="reader" aria-label="Book">
              <div class="reader-col">
                <p class="r-chap">Chapter 2</p>
                <h2>${esc(C.chapter)}</h2>
                <p>${esc(C.lead)}</p>
                ${C.segs
                  .filter((s) => !s.unread)
                  .map((s) => `<p data-seg="${s.id}">${mark(s)}</p>`)
                  .join("")}
                <div class="r-here">You’re here · ${C.place}</div>
                ${C.segs
                  .filter((s) => s.unread)
                  .map((s) => `<p class="unread">${esc(s.text)}</p>`)
                  .join("")}
              </div>
            </div>
            <div class="scroller pane" id="pane">
              ${headHTML(C)}
              <div class="band-row col"><button class="tbtn" data-quiz>Quiz me <kbd>⌘⇧R</kbd></button></div>
              <article class="col doc" contenteditable="true" spellcheck="false" aria-label="Notes">${notesHTML(P)}</article>
            </div>`;
          P.now = () => 0;
          P.pause = () => {};
          P.seen = (s) => !s.unread;
          P.jump = (seg) => {
            const p = $(`[data-seg="${seg.id}"]`, $("#reader", win));
            p.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
            p.classList.remove("flash");
            void p.offsetWidth;
            p.classList.add("flash");
          };
          P.ref = (seg) =>
            `<span class="bkref" contenteditable="false" data-seg="${seg.id}">${seg.page}</span>`;
          P.scroller = $("#pane", win);
          P.layout = () => {};
          const r = $("#reader", win);
          r.scrollTop = r.scrollHeight;
          requestAnimationFrame(() => {
            r.scrollTop = $(".r-here", r).offsetTop - r.clientHeight * 0.55;
          });
        }
        P.doc = $(".doc", win);
        // Pins and page refs jump to their moment.
        win.addEventListener("click", (e) => {
          const ref = e.target.closest(".pin, .bkref, [data-jump]");
          if (!ref) return;
          e.preventDefault();
          P.jump(C.segs.find((s) => s.id === (ref.dataset.seg || ref.dataset.jump)));
        });
        // Pin (⌘⇧M): stamp the caret's bullet with the current moment.
        const pinIt = () => {
          if (!timed(C)) return;
          const sel = getSelection();
          let li = sel.anchorNode;
          while (li && li !== P.doc && li.tagName !== "LI") li = li.parentNode;
          if (!li || li === P.doc) {
            const ul = P.doc.querySelector("ul.notes");
            li = ul.lastElementChild;
          }
          const t = P.now(),
            s = { id: "", at: t };
          const pin = h("span", "pin", PIN);
          pin.contentEditable = "false";
          pin.title = fmt(t);
          pin.dataset.t = t;
          pin.addEventListener("click", (e) => {
            e.stopPropagation();
            P.seek(t);
          });
          if (li.querySelector(":scope > .pin")) {
            const n = h("li");
            n.append(document.createElement("br"), pin);
            li.after(n);
            placeCaret(n, false);
          } else {
            li.append(pin);
          }
        };
        $("[data-pin]", win)?.addEventListener("click", pinIt);
        P.pinIt = pinIt;
        // The Agent launcher lives in every window's bottom-right corner.
        const pill = h("button", "agent-pill", `${ARROW}Agent`);
        pill.addEventListener("click", () =>
          P.onAgent
            ? P.onAgent()
            : setHint("The Agent chat isn’t part of this prototype. Try “Beside”.", 2600),
        );
        win.append(pill);
        $("[data-quiz]", win).addEventListener("click", () => P.onQuiz?.());
        return P;
      }

      /* ============================================================
         1 · SECOND PEN — proto/ai-writing's Second pen, in a source note.
         ⌘. arms the AI for one key, on the selection or the line you're
         on (as in ai-writing):
           ?  quiz me   — recall, then why/how follow-ups, one per press
           @  facts     — with their source, or says it has none
           +  mix       — click the one worth keeping, the rest go
           −  shorten   — only cuts; click a cut to keep it
           →  new topic — while a quiz is going
         From an empty line, ? quizzes you on everything so far.
         Each of your notes also has a ? at its right edge: quiz me on
         this note. The AI writes real bullets in blue ink with a hollow
         marker, under your line; you answer under them. The keys for
         what you can do next sit under the line you're on.
         One request = one line. Esc takes back what you haven't answered.
         ============================================================ */
      function SecondPen(P) {
        const doc = P.doc;
        const win = doc.closest(".win");
        const pane = P.scroller;
        pane.style.position = "relative";
        const btn = $("[data-quiz]", win);
        btn.innerHTML = `Quiz me <kbd>⌘ . ?</kbd>`;
        const segById = (id) => P.C.segs.find((x) => x.id === id);

        const sessions = new WeakMap(); // question line → its quiz
        const pendingOf = new WeakMap(); // answer line → its quiz
        let cur = null,
          busy = false,
          armed = false,
          run = null,
          shortening = null;

        /* ---- Small helpers ---- */
        const lineOf = (n) => {
          while (n && n !== doc && n.tagName !== "LI") n = n.parentNode;
          return n && n.tagName === "LI" ? n : null;
        };
        const caretLi = () => {
          const x = getSelection();
          return x.rangeCount && doc.contains(x.anchorNode) ? lineOf(x.anchorNode) : null;
        };
        const isUser = (li) =>
          li && !li.classList.contains("ai") && !li.classList.contains("pen-keys");
        // A line's own words: not its pins, sub-bullets or the keys under it.
        const txt = (li) =>
          [...li.childNodes]
            .filter(
              (n) =>
                !(
                  n.nodeType === 1 &&
                  (n.tagName === "UL" ||
                    n.classList.contains("pen-keys") ||
                    n.classList.contains("pin") ||
                    n.classList.contains("bkref"))
                ),
            )
            .map((n) => n.textContent)
            .join("")
            .trim();
        const ownTextNode = (li) =>
          [...li.childNodes].find((n) => n.nodeType === 3 && n.data.trim());
        function childList(li) {
          let ul = li.querySelector(":scope > ul");
          if (!ul) {
            ul = h("ul");
            li.append(ul);
          }
          ul.contentEditable = "true";
          return ul;
        }
        // The moment a line is about: its pin or page, else its parent's.
        function segOf(li) {
          const own = li.querySelector(":scope > [data-seg]");
          if (own) return own.dataset.seg;
          const t = li.querySelector(":scope > .pin[data-t]");
          if (t) return [...P.C.segs].reverse().find((x) => x.at <= +t.dataset.t)?.id ?? null;
          const up = li.parentElement.closest("li");
          if (!up) return null;
          if (up.classList.contains("ask")) return sessions.get(up)?.sess.seg?.id ?? null;
          return up.classList.contains("ai") ? null : segOf(up);
        }
        function selLines() {
          const x = getSelection();
          if (!x.rangeCount || x.isCollapsed) return [];
          const r = x.getRangeAt(0);
          if (!doc.contains(r.commonAncestorContainer)) return [];
          return [...doc.querySelectorAll("ul.notes li")].filter(
            (li) =>
              isUser(li) &&
              [...li.childNodes].some(
                (n) => n.nodeType === 3 && n.data.trim() && r.intersectsNode(n),
              ),
          );
        }
        // What a request is about: your lines, a quiz you're in, or everything so far.
        function target(over) {
          const sel = over ? over : selLines();
          const lines = (sel.length ? sel : [caretLi()]).filter(isUser);
          const user = lines.filter((l) => txt(l));
          const q = lines.map((l) => l.closest("li.ai.ask")).find(Boolean);
          const segs = [...new Set(user.map(segOf).filter(Boolean))];
          const base = { user, at: lines[lines.length - 1] || null };
          if (q && sessions.has(q)) return { ...base, kind: "continue", s: sessions.get(q) };
          if (segs.length)
            return {
              ...base,
              kind: "lines",
              key: segs.join(),
              anchor: user[user.length - 1],
              segs,
            };
          return {
            ...base,
            kind: "all",
            key: "all",
            slot: lines.find((l) => !txt(l) && !l.closest("li.ai")) || null,
          };
        }
        const soFar = () => `everything so far <b>to ${timed(P.C) ? fmt(P.now()) : P.C.place}</b>`;

        /* ---- The keys, under the line you're on ---- */
        let keys = null,
          kt = null;
        function showKeys(html, li, ms) {
          clearTimeout(kt);
          keys?.remove();
          keys = null;
          if (!html) return;
          li = li?.isConnected ? li : doc.querySelector("ul.notes").lastElementChild;
          keys = h("li", "pen-keys", html);
          keys.contentEditable = "false";
          keys.setAttribute("aria-live", "polite");
          const sub = !li.classList.contains("ai") && li.querySelector(":scope > ul");
          sub ? sub.prepend(keys) : li.after(keys);
          if (ms)
            kt = setTimeout(() => {
              keys?.remove();
              keys = null;
            }, ms);
        }
        P.timers.push(() => clearTimeout(kt));
        const ANSWER = `<kbd>↵</kbd> answer <span class="gap"></span><kbd>↵</kbd> on an empty line: I don’t know <span class="gap"></span><kbd>Esc</kbd> take it back`;
        const AFTER = `<kbd>⌘ .</kbd> <kbd>?</kbd> one more <span class="gap"></span><kbd>⌘ .</kbd> <kbd>→</kbd> new topic`;

        function arm(on) {
          armed = on;
          doc.classList.toggle("armed", on);
          CSS.highlights?.delete("proto-armed");
          if (!on) {
            showKeys(null);
            return;
          }
          const t = target();
          if (getSelection().isCollapsed && t.user.length) {
            const node = ownTextNode(t.user[0]);
            if (node) {
              const r = document.createRange();
              r.selectNodeContents(node);
              CSS.highlights?.set("proto-armed", new Highlight(r));
            }
          }
          const going = t.kind === "continue" || (cur && cur.key === t.key && cur.started);
          showKeys(
            t.user.length
              ? `<kbd>?</kbd> quiz me <kbd>@</kbd> facts <kbd>+</kbd> mix <kbd>−</kbd> shorten ${going ? `<kbd>→</kbd> new topic ` : ""}<span class="gap"></span><kbd>Esc</kbd> never mind`
              : `<kbd>?</kbd> quiz me on ${soFar()} <span class="gap"></span><kbd>Esc</kbd> never mind`,
            t.at || caretLi(),
          );
        }

        function aiLine(cls) {
          const li = h("li", "ai " + cls);
          li.contentEditable = "false";
          li.tabIndex = 0;
          li.append(h("span", "t"));
          return li;
        }
        function answerLine(where, s, item, inside = false) {
          const a = h("li");
          a.append(document.createElement("br"));
          inside ? where.append(a) : where.after(a);
          s.pending = { li: a, item };
          pendingOf.set(a, s);
          placeCaret(a);
          a.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
          return a;
        }
        const srcBtn = (seg) =>
          `<button class="src" data-jump="${seg.id}" aria-label="Go to ${where(P, seg)}">— ${timed(P.C) ? PIN : ""}${where(P, seg)}</button>`;
        const fadeRemove = (nodes) => {
          nodes.forEach((n) => n.classList.add("leaving"));
          setTimeout(() => nodes.forEach((n) => n.remove()), reduced ? 0 : 150);
        };

        /* ---- ? quiz me ---- */
        async function quiz(mode, over) {
          if (busy || shortening) return;
          showKeys(null);
          const t = target(over);
          let s =
            t.kind === "continue"
              ? t.s
              : cur && cur.key === t.key && cur.last?.isConnected
                ? cur
                : null;
          if (!s)
            s = {
              sess: engine(P, t.kind === "lines" ? t.segs : null),
              key: t.key,
              scoped: t.kind === "lines",
              anchor: t.anchor,
              slot: t.slot,
              last: null,
              pending: null,
              started: false,
            };
          cur = s;
          if (s.pending?.li.isConnected) {
            placeCaret(s.pending.li);
            showKeys(ANSWER, s.pending.li);
            return;
          }
          const item = mode === "next" || !s.started ? s.sess.nextIdea() : s.sess.deeper();
          if (!item) {
            showKeys(
              s.scoped ? "That's all I have on this line. The rest is yours." : s.sess.doneLine(),
              s.last || t.at,
              2600,
            );
            return;
          }
          s.started = true;
          P.pause(true);
          busy = true;
          const q = aiLine("ask");
          if (s.last?.isConnected) s.last.after(q);
          else if (s.scoped) childList(s.anchor).prepend(q);
          else if (s.slot?.isConnected && !txt(s.slot)) s.slot.replaceWith(q);
          else doc.querySelector("ul.notes").append(q);
          s.last = q;
          sessions.set(q, s);
          q.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
          await writeWords($(".t", q), item.q);
          const sub = h("ul");
          sub.contentEditable = "true";
          q.append(sub);
          const a = answerLine(sub, s, item, true);
          busy = false;
          showKeys(ANSWER, a);
        }

        async function submit(s) {
          const { li: a } = s.pending;
          const text = txt(a);
          s.pending = null;
          pendingOf.delete(a);
          showKeys(null);
          busy = true;
          if (!text) a.innerHTML = `<span class="dk" contenteditable="false">I don’t know</span>`;
          const r = s.sess.answer(text);
          if (r.hint) {
            const cue = aiLine("cue");
            a.after(cue);
            await writeWords($(".t", cue), "Hint: " + r.hint.q);
            const a2 = answerLine(cue, s, r.hint);
            busy = false;
            showKeys(ANSWER, a2);
            return;
          }
          let last = a;
          if (r.reveal) {
            const c = aiLine("chk");
            a.parentElement.append(c);
            await writeWords($(".t", c), `“${r.reveal.src}”`, srcBtn(r.reveal), "Written by AI: ");
            last = c;
          }
          busy = false;
          if (text) placeCaret(a);
          showKeys(AFTER, last, 5000);
        }

        /* ---- @ facts, + mix (proto/ai-writing's Second pen) ---- */
        function linesFor(kind, seg) {
          if (kind === "facts")
            return seg?.facts?.length
              ? seg.facts.map(([t, src]) => ({ t, src }))
              : [{ t: "No fact here I'd stand behind. Try selecting a specific claim." }];
          return (
            seg?.mix?.length
              ? seg.mix
              : [
                  "× chess — what's the opening move?",
                  "× jazz — where's the improvisation?",
                  "× gardening — what gets pruned?",
                ]
          ).map((t) => ({ t }));
        }
        async function aiRun(kind, t) {
          if (busy || shortening) return;
          const anchor = t.user[t.user.length - 1];
          if (!anchor) {
            showKeys("Put the caret on a note first.", t.at, 2200);
            return;
          }
          const again =
            run &&
            run.anchor === anchor &&
            run.kind === kind &&
            run.batch.every((n) => n.isConnected);
          if (!again)
            run = { anchor, kind, i: -1, lines: linesFor(kind, segById(segOf(anchor))), batch: [] };
          if (run.i + 1 >= run.lines.length) {
            showKeys("That's all I have on this line. The rest is yours.", anchor, 2200);
            return;
          }
          const r = run;
          r.i++;
          busy = true;
          const l = r.lines[r.i];
          const li = aiLine(kind === "mix" ? "mix" : "fact");
          li._batch = r.batch;
          const prev = r.batch[r.batch.length - 1];
          prev ? prev.after(li) : childList(anchor).prepend(li);
          r.batch.push(li);
          await writeWords(
            $(".t", li),
            l.t,
            l.src ? `<span class="src">— ${esc(l.src)}</span>` : "",
            "Written by AI: ",
          );
          busy = false;
          const more = r.i + 1 < r.lines.length;
          showKeys(
            `${more ? `<kbd>⌘ .</kbd> <kbd>${kind === "facts" ? "@" : "+"}</kbd> one more <span class="gap"></span>` : ""}${kind === "mix" ? 'Click the one worth keeping <span class="gap"></span>' : ""}<kbd>Esc</kbd> take it back`,
            li,
            4000,
          );
        }

        /* ---- − shorten (proto/ai-writing): only cuts; click a cut to keep it ---- */
        function shorten(lines) {
          if (busy || shortening) return;
          const CUTS = [
            /\b(?:I think |basically |actually |really |just |kind of |quite |literally |very |maybe )/gi,
            / (?:completely|anyway)(?=[,.]|$)/gi,
            / lol\b/gi,
            /^the thing about /gi,
          ];
          const jobs = lines
            .map((li) => {
              const node = ownTextNode(li);
              const text = node ? node.data : "",
                cuts = [];
              for (const re of CUTS)
                for (const m of text.matchAll(re)) {
                  const x = m.index,
                    y = x + m[0].length;
                  if (!cuts.some((c) => x < c.b && y > c.a)) cuts.push({ a: x, b: y });
                }
              cuts.sort((p, q) => p.a - q.a);
              return { li, node, text, cuts };
            })
            .filter((j) => j.cuts.length);
          const at = lines[lines.length - 1];
          if (!jobs.length) {
            showKeys("Nothing to cut. Every word is pulling its weight.", at, 2200);
            return;
          }
          getSelection().removeAllRanges();
          doc.contentEditable = "false";
          for (const j of jobs) {
            const span = document.createElement("span");
            let html = "",
              k = 0;
            j.cuts.forEach((c, i) => {
              html +=
                esc(j.text.slice(k, c.a)) +
                `<span class="cut" data-i="${i}" title="Click to keep these words">${esc(j.text.slice(c.a, c.b))}</span>`;
              k = c.b;
            });
            span.innerHTML = html + esc(j.text.slice(k));
            j.span = span;
            j.node.replaceWith(span);
            span.querySelectorAll(".cut").forEach((x) =>
              x.addEventListener("click", (e) => {
                e.stopPropagation();
                const c = j.cuts[+x.dataset.i];
                c.kept = !c.kept;
                x.toggleAttribute("data-kept");
                count();
              }),
            );
          }
          const tidy = (t) =>
            t
              .replace(/\s{2,}/g, " ")
              .replace(/\s+([.,?!])/g, "$1")
              .replace(/(^|[.?!]\s+)([a-z])/g, (m, x, y) => x + y.toUpperCase());
          const result = (j) =>
            tidy(
              j.cuts.reduceRight((t, c) => (c.kept ? t : t.slice(0, c.a) + t.slice(c.b)), j.text),
            );
          const words = (t) => t.split(/\s+/).filter(Boolean).length;
          function count() {
            const d = jobs.reduce((n, j) => n + words(result(j)) - words(j.text), 0);
            showKeys(
              `<b>${String(d).replace("-", "−")} words</b> Only cuts. Click a cut to keep it. <span class="gap"></span><kbd>↵</kbd> shorten <kbd>Esc</kbd> cancel`,
              at,
            );
          }
          shortening = async (apply) => {
            shortening = null;
            if (apply && !reduced) {
              jobs.forEach((j) =>
                j.span
                  .querySelectorAll(".cut:not([data-kept])")
                  .forEach((c) => c.classList.add("going")),
              );
              await wait(150);
            }
            for (const j of jobs)
              j.span.replaceWith(document.createTextNode(apply ? result(j) : j.text));
            doc.contentEditable = "true";
            showKeys(null);
          };
          count();
        }

        /* ---- Esc: take back what you haven't answered ---- */
        function takeBack() {
          const li = caretLi();
          const s = li && pendingOf.get(li);
          if (s && !txt(li)) {
            const ai = li.previousElementSibling?.classList.contains("cue")
              ? li.previousElementSibling
              : li.closest("li.ai.ask");
            const isQ = ai.classList.contains("ask");
            if (isQ && s.last === ai)
              s.last = ai.previousElementSibling?.classList.contains("ask")
                ? ai.previousElementSibling
                : null;
            s.pending = null;
            pendingOf.delete(li);
            showKeys(null);
            // A question that took your empty line's place gives the line back.
            const back = isQ && s.slot && !s.slot.isConnected && !s.last ? s.slot : null;
            const gone = isQ ? [ai] : [ai, li];
            gone.forEach((n) => n.classList.add("leaving"));
            setTimeout(
              () => {
                if (back) {
                  ai.replaceWith(back);
                  placeCaret(back);
                }
                gone.forEach((n) => n.remove());
              },
              reduced ? 0 : 150,
            );
            return true;
          }
          if (run?.batch.length && run.batch.some((n) => n.isConnected)) {
            fadeRemove(
              run.batch.filter(
                (n) =>
                  n.isConnected &&
                  !n.querySelector(":scope > ul li:not(.pen-keys)")?.textContent.trim(),
              ),
            );
            run = null;
            showKeys(null);
            return true;
          }
          return false;
        }

        function indent(li, out) {
          if (out) {
            const up = li.parentElement.closest("li");
            if (up && isUser(up)) up.after(li);
          } else {
            const prev = li.previousElementSibling;
            if (prev && isUser(prev)) childList(prev).append(li);
          }
        }

        P.onQuiz = () => quiz("ask");
        P.onEsc = () => {
          if (shortening) {
            shortening(false);
            return true;
          }
          if (armed) {
            arm(false);
            return true;
          }
          return takeBack();
        };

        const onKey = (e) => {
          if (!doc.isConnected) return;
          if (shortening) {
            if (e.key === "Enter") {
              e.preventDefault();
              shortening(true);
            }
            return;
          }
          if (e.metaKey && (e.key === "." || e.code === "Period")) {
            e.preventDefault();
            arm(!armed);
            return;
          }
          if (armed) {
            if (e.key === "Shift" || e.key === "Escape") return; // ? @ + need Shift; Esc is P.onEsc's
            const t = target();
            arm(false);
            const k =
              e.key === "/" && e.shiftKey
                ? "?"
                : e.key === "2" && e.shiftKey
                  ? "@"
                  : e.key === "=" && e.shiftKey
                    ? "+"
                    : e.key;
            if (k === "?") {
              e.preventDefault();
              quiz("ask");
              return;
            }
            if (k === "ArrowRight") {
              e.preventDefault();
              quiz("next");
              return;
            }
            if (k === "@") {
              e.preventDefault();
              aiRun("facts", t);
              return;
            }
            if (k === "+") {
              e.preventDefault();
              aiRun("mix", t);
              return;
            }
            if (k === "-" || k === "−") {
              e.preventDefault();
              if (t.user.length) shorten(t.user);
              else showKeys("Put the caret on a note first.", t.at, 2200);
              return;
            }
            return; // any other key: not for the AI, it types as usual
          }
          if (!doc.contains(document.activeElement) && document.activeElement !== doc) return;
          if (e.key === "Tab") {
            const li = caretLi();
            if (isUser(li) && !pendingOf.get(li)) {
              e.preventDefault();
              indent(li, e.shiftKey);
              placeCaret(li);
            }
            return;
          }
          if (e.key !== "Enter") return;
          if (busy) {
            e.preventDefault();
            return;
          }
          const li = caretLi();
          const s = li && pendingOf.get(li);
          if (s && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
            e.preventDefault();
            submit(s);
          }
        };
        document.addEventListener("keydown", onKey, true);
        P.timers.push(() => document.removeEventListener("keydown", onKey, true));
        doc.addEventListener("mousedown", () => armed && arm(false));

        // Click an AI line to answer under it; a mix you click is kept and the others go.
        doc.addEventListener("click", (e) => {
          const ai = e.target.closest("li.ai");
          if (
            !ai ||
            ai.classList.contains("cue") ||
            ai.classList.contains("chk") ||
            e.target.closest(".src")
          )
            return;
          const ul = e.target.closest("ul");
          if (ul && ai.contains(ul)) return; // clicks inside your answers are yours
          if (ai.classList.contains("mix") && ai._batch) {
            fadeRemove(ai._batch.filter((b) => b !== ai && b.isConnected));
            if (run?.batch === ai._batch) run = null;
          }
          const a = h("li");
          a.append(document.createElement("br"));
          childList(ai).append(a);
          placeCaret(a);
        });
        doc.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.matches?.("li.ai.ask, li.ai.fact, li.ai.mix")) {
            e.preventDefault();
            e.target.click();
          }
        });

        /* ---- ? at the right edge of every note: quiz me on this one ---- */
        const qz = h("button", "qz", "?");
        qz.type = "button";
        qz.setAttribute("aria-label", "Quiz me on this note");
        qz.title = "Quiz me on this note (⌘ . ?)";
        qz.hidden = true;
        pane.append(qz);
        let qzLi = null,
          hoverLi = null;
        function placeQz() {
          const li = hoverLi || caretLi();
          if (!isUser(li) || !txt(li) || shortening || li.closest("li.cue, li.chk")) {
            qz.hidden = true;
            qzLi = null;
            return;
          }
          qzLi = li;
          const pr = pane.getBoundingClientRect(),
            dr = doc.getBoundingClientRect();
          const n = ownTextNode(li);
          let r = li.getBoundingClientRect();
          if (n) {
            const rg = document.createRange();
            rg.setStart(n, 0);
            rg.setEnd(n, Math.min(1, n.length));
            r = rg.getBoundingClientRect();
          }
          qz.style.top = `${r.top - pr.top + pane.scrollTop + r.height / 2}px`;
          qz.style.left = `${dr.right - pr.left + 8}px`;
          qz.hidden = false;
        }
        doc.addEventListener("mouseover", (e) => {
          const li = e.target.closest("li");
          hoverLi = isUser(li) ? li : hoverLi;
          placeQz();
        });
        doc.addEventListener("mouseleave", (e) => {
          if (e.relatedTarget !== qz) {
            hoverLi = null;
            placeQz();
          }
        });
        qz.addEventListener("mouseleave", (e) => {
          if (!doc.contains(e.relatedTarget)) {
            hoverLi = null;
            placeQz();
          }
        });
        qz.addEventListener("mousedown", (e) => e.preventDefault()); // keep the caret where it is
        qz.addEventListener("click", () => {
          if (qzLi) quiz("ask", [qzLi]);
        });
        const onSel = () => {
          if (!hoverLi) placeQz();
        };
        document.addEventListener("selectionchange", onSel);
        P.timers.push(() => document.removeEventListener("selectionchange", onSel));
        new ResizeObserver(() => placeQz()).observe(doc);
      }

      /* ============================================================
         2 · Closed book — the video and your notes blur out while you
         answer, so it's real recall, not reading. One question on one
         card. Check shows your answer beside the source (and your own
         note); then Go deeper or New topic. Stop writes the session
         into the note as a closed Recall toggle, like the transcript.
         ============================================================ */
      function ClosedBook(P) {
        const win = P.doc.closest(".win");
        let sess = null,
          ov = null,
          log = [],
          item = null;

        P.onQuiz = () => {
          if (ov) {
            $(".field", ov)?.focus();
            return;
          }
          P.pause(false);
          sess ??= engine(P);
          ov = h("div", "cb");
          ov.setAttribute("role", "dialog");
          ov.setAttribute("aria-modal", "true");
          ov.setAttribute("aria-label", "Quiz, closed book");
          ov.innerHTML = `<div class="cb-veil"></div><div class="cb-card"></div>`;
          win.append(ov);
          ov.querySelector(".cb-veil").addEventListener("click", () => $(".field", ov)?.focus());
          showAsk(sess.nextIdea());
        };

        const card = () => $(".cb-card", ov);
        // Before an answer the header names no chapter: it would give the answer away.
        const top = (seg, after) =>
          `<div class="cb-top"><span class="cb-where">${!seg ? (timed(P.C) ? P.C.short : P.C.title) : !after ? `Question ${asked}` : timed(P.C) ? `${fmt(seg.at)} · ${chapterOf(P.C, seg.at)}` : `${seg.page} · ${P.C.chapter}`}</span><button class="cb-stop" data-stop>Stop <kbd>esc</kbd></button></div>`;
        let asked = 0;

        async function showAsk(it) {
          item = it;
          if (!it) {
            card().innerHTML = `${top(null)}<p class="cb-done"></p><div class="cb-actions"><button class="btn primary" data-stop>Stop <kbd>esc</kbd></button></div>`;
            await writeWords($(".cb-done", card()), sess.doneLine());
            $(".btn.primary", card()).focus();
            return;
          }
          if (it.kind !== "hint") asked++;
          card().innerHTML = `${top(it.seg)}
            ${it.kind === "hint" ? `<div class="cb-kind">Hint</div>` : ""}
            <p class="cb-q"></p>
            <form class="cb-form">
              <label class="cb-label" for="cb-a">Your answer</label>
              <textarea class="field" id="cb-a" rows="3" spellcheck="false"></textarea>
              <div class="cb-actions">
                <button type="button" class="btn ghost" data-dk>I don’t know</button>
                <button type="submit" class="btn primary">${it.kind === "deeper" ? "Answer" : "Check"} <kbd>⌘↵</kbd></button>
              </div>
            </form>`;
          const ta = $(".field", card());
          ta.focus();
          await writeWords($(".cb-q", card()), it.q);
          const form = $("form", card());
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            answer(ta.value.trim());
          });
          ta.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
              e.preventDefault();
              answer(ta.value.trim());
            }
          });
          $("[data-dk]", card()).addEventListener("click", () => answer(""));
        }

        function answer(text) {
          const it = item;
          // A hint belongs to its question: its answer is the question's answer.
          if (it.kind === "hint") Object.assign(log[log.length - 1], { a: text, hinted: true });
          else log.push({ q: it.q, a: text, kind: it.kind });
          const r = sess.answer(text);
          if (r.hint) {
            showAsk(r.hint);
            return;
          }
          const seg = it.seg;
          const notes = r.reveal ? notesFor(P, seg) : [];
          const deeper = sess.hasDeeper(),
            next = sess.hasNext();
          card().innerHTML = `${top(seg, true)}
            <p class="cb-q">${esc(it.q)}</p>
            <div class="cb-label">Your answer</div>
            <p class="cb-yours${text ? "" : " empty"}">${text ? esc(text) : "I don’t know"}</p>
            ${r.reveal ? `<div class="cb-src"><div class="cb-src-label">${srcLabel(P, seg)}</div><p>${esc(seg.src)}</p></div>` : ""}
            ${notes.length ? `<div class="cb-src"><div class="cb-src-label">Your notes</div><ul>${notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
            <div class="cb-actions">
              <button class="btn ghost" data-next ${next ? "" : "disabled"}>New topic</button>
              <button class="btn primary" data-deeper ${deeper ? "" : "disabled"}>Go deeper <kbd>⌘↵</kbd></button>
            </div>`;
          const primary = deeper
            ? $("[data-deeper]", card())
            : next
              ? $("[data-next]", card())
              : null;
          if (!deeper && next) {
            const b = $("[data-next]", card());
            b.className = "btn primary";
            b.innerHTML = `New topic <kbd>⌘↵</kbd>`;
            $("[data-deeper]", card()).className = "btn ghost";
            $("[data-deeper]", card()).innerHTML = "Go deeper";
          }
          (primary || $("[data-stop]", card())).focus();
          $("[data-deeper]", card()).addEventListener("click", () => showAsk(sess.deeper()));
          $("[data-next]", card()).addEventListener("click", () => showAsk(sess.nextIdea()));
          if (!deeper && !next) showAsk(null);
        }

        function stop() {
          if (!ov) return;
          const leaving = ov;
          ov = null;
          leaving.classList.add("leaving");
          setTimeout(() => leaving.remove(), reduced ? 0 : 150);
          const done = log;
          log = [];
          if (!done.length) return;
          const d = h("details", "recall");
          d.contentEditable = "false";
          d.innerHTML =
            `<summary>Recall · ${TODAY} · ${done.length} question${done.length > 1 ? "s" : ""}</summary>` +
            done
              .map(
                (e) =>
                  `<p class="rq">${esc(e.q)}</p><p class="ra${e.a ? "" : " empty"}">${e.a ? esc(e.a) : "I don’t know"}${e.hinted && e.a ? ` <span class="dk">(after a hint)</span>` : ""}</p>`,
              )
              .join("");
          P.doc.append(d);
          d.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
          const s = d.querySelector("summary");
          s.classList.add("flash");
          setHint(`Saved to this note as <b>Recall · ${TODAY}</b>.`, 2600);
        }
        P.onEsc = () => {
          if (ov) {
            stop();
            return true;
          }
        };
        win.addEventListener("click", (e) => {
          if (e.target.closest("[data-stop]")) stop();
        });
      }

      /* ============================================================
         3 · Beside — the quiz is a conversation in the Agent panel.
         Video and notes stay open (open book): play, scrub, reread.
         The AI asks, quotes the source with a jump chip after a recall
         answer, then follows up. Chips steer; Keep in note copies an
         answer into the note with its pin. Close ends it.
         ============================================================ */
      function Beside(P) {
        const win = P.doc.closest(".win");
        let sess = null,
          ap = null,
          item = null,
          busy = false,
          chats = [];

        function open() {
          ap = h("section", "ap");
          ap.setAttribute("role", "dialog");
          ap.setAttribute("aria-label", "Quiz");
          ap.innerHTML = `
            <header class="ap-head"><span class="ap-title">Quiz · ${esc(P.C.short)}</span><button class="icon-btn" data-close aria-label="Close quiz">${CLOSE}</button></header>
            <div class="ap-msgs" aria-live="polite"></div>
            <div class="ap-foot">
              <div class="ap-chips">
                <button class="chip" data-dk>I don’t know</button>
                <button class="chip" data-deep>Go deeper</button>
                <button class="chip" data-next>New topic</button>
              </div>
              <form class="ap-comp"><label class="sr-only" for="ap-in">Your answer</label><textarea id="ap-in" rows="1" placeholder="Your answer" spellcheck="false"></textarea><button class="send" type="submit" aria-label="Send answer" disabled>${UP}</button></form>
            </div>`;
          win.append(ap);
          const msgs = $(".ap-msgs", ap);
          chats.forEach((n) => msgs.append(n));
          const ta = $("textarea", ap),
            send = $(".send", ap);
          const grow = () => {
            ta.style.height = "auto";
            ta.style.height = ta.scrollHeight + "px";
            send.disabled = !ta.value.trim() || busy || !item;
          };
          ta.addEventListener("input", grow);
          ta.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              if (!send.disabled) reply(ta.value.trim());
            }
          });
          $("form", ap).addEventListener("submit", (e) => {
            e.preventDefault();
            if (!send.disabled) reply(ta.value.trim());
          });
          $("[data-close]", ap).addEventListener("click", close);
          $("[data-dk]", ap).addEventListener("click", () => reply(""));
          $("[data-deep]", ap).addEventListener("click", () => ask(sess.deeper()));
          $("[data-next]", ap).addEventListener("click", () => ask(sess.nextIdea()));
          ap.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              e.preventDefault();
              close();
            }
          });
          ap.grow = grow;
          ta.focus();
          msgs.scrollTop = msgs.scrollHeight;
        }
        function close() {
          if (!ap) return;
          const leaving = ap;
          ap = null;
          leaving.classList.add("leaving");
          setTimeout(() => leaving.remove(), reduced ? 0 : 140);
          $("[data-quiz]", win).removeAttribute("data-on");
        }
        function sync() {
          if (!ap) return;
          $("[data-dk]", ap).disabled = busy || !item;
          $("[data-deep]", ap).disabled = busy || !sess.hasDeeper();
          $("[data-next]", ap).disabled = busy || !sess.hasNext();
          ap.grow();
        }
        const push = (node) => {
          chats.push(node);
          if (ap) {
            const m = $(".ap-msgs", ap);
            m.append(node);
            m.scrollTo({ top: m.scrollHeight, behavior: reduced ? "auto" : "smooth" });
          }
        };

        async function ask(it) {
          busy = true;
          item = null;
          sync();
          const typing = h(
            "div",
            "m ai",
            `<span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span>`,
          );
          push(typing);
          if (!reduced) await wait(420);
          typing.remove();
          chats = chats.filter((n) => n !== typing);
          const m = h("div", "m ai ask");
          push(m);
          await writeWords(m, it ? (it.kind === "hint" ? "Hint: " + it.q : it.q) : sess.doneLine());
          if (!it) m.className = "m ai done";
          item = it;
          busy = false;
          sync();
          if (ap) $("textarea", ap).focus();
        }

        async function reply(text) {
          if (busy || !item) return;
          const it = item;
          const me = h(
            "div",
            "m me",
            `<div class="bubble${text ? "" : " empty"}">${text ? esc(text) : "I don’t know"}</div>`,
          );
          if (text) {
            const keep = h("button", "keep", `${PLUS}Keep in note`);
            keep.addEventListener("click", () => {
              const ul = P.doc.querySelector("ul.notes");
              let li = ul.lastElementChild;
              if (li && li.textContent.trim()) {
                li = h("li");
                ul.append(li);
              }
              li.innerHTML = esc(text) + P.ref(it.seg);
              li.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
              li.classList.add("flash");
              keep.disabled = true;
              keep.innerHTML = `${TICK}Kept`;
            });
            me.append(keep);
          }
          push(me);
          if (ap) {
            const ta = $("textarea", ap);
            ta.value = "";
          }
          const r = sess.answer(text);
          if (r.hint) return ask(r.hint);
          if (r.reveal) {
            const seg = r.reveal;
            busy = true;
            item = null;
            sync();
            if (!reduced) await wait(300);
            const verb = SAYS[P.C.kind];
            const at = `<button class="tchip" data-jump="${seg.id}" aria-label="Go to ${where(P, seg)}">${timed(P.C) ? PIN : ""}${where(P, seg)}</button>`;
            push(
              h(
                "div",
                "m ai src",
                `${timed(P.C) ? "At" : "On"} ${at} ${verb}: <q>${esc(seg.src)}</q>`,
              ),
            );
          }
          ask(sess.deeper());
        }

        P.onQuiz = () => {
          $("[data-quiz]", win).setAttribute("data-on", "");
          if (!sess) {
            sess = engine(P);
            P.pause(true);
            open();
            ask(sess.nextIdea());
            return;
          }
          if (!ap) {
            open();
            sync();
          } else $("textarea", ap).focus();
        };
        P.onAgent = () => (ap ? close() : P.onQuiz());
        P.onEsc = () => {
          if (ap) {
            close();
            return true;
          }
        };
      }

      /* ---------------- Harness ---------------- */
      const variants = [SecondPen, ClosedBook, Beside];
      const win = $("#win");
      const params = new URLSearchParams(location.search);
      const S = {
        ctx: ["book", "podcast"].includes(params.get("ctx")) ? params.get("ctx") : "video",
        notes: params.get("notes") !== "0",
      };
      let P = null;

      function mount(i) {
        P?.timers.forEach((f) => f());
        win.removeAttribute("data-mini");
        setHint("");
        P = buildPage(win, S.ctx, S.notes);
        variants[i](P);
      }

      const ctxBtns = [...document.querySelectorAll(".proto-ctx button")];
      function syncCtx() {
        ctxBtns.forEach((b) =>
          b.toggleAttribute(
            "data-active",
            b.dataset.ctx ? b.dataset.ctx === S.ctx : (b.dataset.notes === "1") === S.notes,
          ),
        );
        const url = new URL(location);
        url.searchParams.set("ctx", S.ctx);
        url.searchParams.set("notes", S.notes ? "1" : "0");
        history.replaceState(null, "", url);
      }
      ctxBtns.forEach((b) =>
        b.addEventListener("click", () => {
          if (b.dataset.ctx) S.ctx = b.dataset.ctx;
          else S.notes = b.dataset.notes === "1";
          syncCtx();
          mount(current);
        }),
      );
      syncCtx();

      // App-wide keys for the prototype's page: ⌘⇧R quiz, ⌘⇧M pin, ⌘⇧J play, Esc stop.
      document.addEventListener(
        "keydown",
        (e) => {
          const k = e.key.toLowerCase();
          if (e.metaKey && e.shiftKey && k === "r") {
            e.preventDefault();
            P.onQuiz?.();
            return;
          }
          if (e.metaKey && e.shiftKey && k === "m") {
            e.preventDefault();
            P.pinIt?.();
            return;
          }
          if (e.metaKey && e.shiftKey && k === "j") {
            e.preventDefault();
            P.toggle?.();
            return;
          }
          if (e.key === "Escape" && P.onEsc?.()) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true,
      );

      /* ---------------- Picker (PICKER.md reference wiring) ---------------- */
      const picker = document.querySelector(".proto-picker");
      const highlight = picker.querySelector(".proto-picker-highlight");
      const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + "px";
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }
      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute("data-active", j === i);
          if (j === i) el.setAttribute("aria-current", "true");
          else el.removeAttribute("aria-current");
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set("v", i + 1);
        history.replaceState(null, "", url);
        mount(i);
      }
      items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
      addEventListener("resize", moveHighlight);
      document.addEventListener("keydown", (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable)
          return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
        else if (e.key === "ArrowLeft")
          setActive((current - 1 + variants.length) % variants.length);
      });
      setActive((parseInt(params.get("v"), 10) || 1) - 1);
      requestAnimationFrame(() =>
        requestAnimationFrame(() => picker.setAttribute("data-ready", "")),
      );
    </script>
  </body>
</html>
